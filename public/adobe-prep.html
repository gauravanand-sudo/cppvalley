      align-items: center;

      padding: 12px 14px;
      background: #fff;

function dayId(pi, di) { return `${pi}-${di}`; }
function totalDays() { return phases.reduce((s, p) => s + p.days.length, 0); }
function doneDays() { return Object.values(prog).filter(Boolean).length; }

function renderStats() {
  const total = totalDays(), done = doneDays();
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('stat-row').innerHTML = `
    <span class="pill">${total} days</span>
    <span class="pill pill-done">${done} completed</span>
    <span class="pill">${pct}% done</span>
    <span class="pill">CS1 ready in ~10 weeks</span>
    <span class="pill">CS2 confidence in ~14 weeks</span>
  `;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const pf = document.getElementById('phase-filter').value;
  const sf = document.getElementById('status-filter').value;
  const wrap = document.getElementById('phases-wrap');
  wrap.innerHTML = '';
  let anyVisible = false;

  phases.forEach((phase, pi) => {
    if (pf !== 'all' && pf !== String(pi)) return;

    const filtered = phase.days.filter((day, di) => {
      const done = !!prog[dayId(pi, di)];
      if (sf === 'done' && !done) return false;
      if (sf === 'pending' && done) return false;
      if (!q) return true;
      const hay = [day.day, day.topic, day.lld, day.core, ...(day.hard || []), ...(day.medium || [])].join(' ').toLowerCase();
      return hay.includes(q);
    });

    if (!filtered.length) return;
    anyVisible = true;

    const doneInPhase = phase.days.filter((_, di) => prog[dayId(pi, di)]).length;
    const pct = Math.round((doneInPhase / phase.days.length) * 100);

    const phaseEl = document.createElement('div');
    phaseEl.className = 'phase';

    phaseEl.innerHTML = `
      <div class="phase-header" onclick="togglePhase(this)">
        <div>
          <div class="phase-title">${phase.title}</div>
          <div class="phase-desc">${phase.desc}</div>
        </div>
        <div class="phase-right">
          <span class="phase-count">${doneInPhase}/${phase.days.length}</span>
          <span class="chevron open">▼</span>
        </div>
      </div>
      <div class="phase-progress"><div class="phase-progress-fill" style="width:${pct}%"></div></div>
      <div class="days-list"></div>
    `;

    const daysList = phaseEl.querySelector('.days-list');

    filtered.forEach((day) => {
      const di = phase.days.indexOf(day);
      const id = dayId(pi, di);
      const done = !!prog[id];
      const hasMed = day.medium && day.medium.length > 0;

      const card = document.createElement('div');
      card.className = 'day-card' + (done ? ' done' : '');
      card.innerHTML = `
        <div class="day-top">
          <div>
            <div class="day-num">${day.day}</div>
            <div class="day-title">${day.topic}</div>
          </div>
          <button class="mark-btn${done ? ' done' : ''}" data-id="${id}">
            <span class="check-circle">${done ? '✓' : ''}</span>
            ${done ? 'Completed' : 'Mark done'}
          </button>
        </div>
        <div class="sections">
          <div class="sec">
            <div class="sec-label accent">Hard / medium-hard</div>
            <ul>${(day.hard || []).map(h => `<li>${h}</li>`).join('')}</ul>
          </div>
          ${hasMed ? `<div class="sec"><div class="sec-label">Medium / reinforcement</div><ul>${day.medium.map(m => `<li>${m}</li>`).join('')}</ul></div>` : ''}
          <div class="sec">
            <div class="sec-label">LLD exercise</div>
            <p>${day.lld}</p>
          </div>
          <div class="sec">
            <div class="sec-label">Core concept</div>
            <p>${day.core}</p>
          </div>
        </div>
      `;
      daysList.appendChild(card);
    });

    wrap.appendChild(phaseEl);
  });

  if (!anyVisible) {
    wrap.innerHTML = '<div class="empty">No days match your filters.</div>';
  }

  bindButtons();
  renderStats();
}

function togglePhase(hdr) {
  const body = hdr.parentElement.querySelector('.days-list');
  const bar = hdr.parentElement.querySelector('.phase-progress');
  const chev = hdr.querySelector('.chevron');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  bar.style.display = isOpen ? 'none' : '';
  chev.className = 'chevron' + (isOpen ? '' : ' open');
}

function bindButtons() {
  document.querySelectorAll('.mark-btn[data-id]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      prog[id] = !prog[id];
      save();
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('phase-filter').addEventListener('change', render);
document.getElementById('status-filter').addEventListener('change', render);
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Reset all progress?')) { prog = {}; save(); render(); }
});

render();
</script>
