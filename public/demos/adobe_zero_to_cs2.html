
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary)}

    .pill-done{background:#9B1C3A;color:#fff;border-color:#9B1C3A}

    .phase-meta{min-width:0}
    .phase-title{font-size:14px;font-weight:500;margin-bottom:2px}
    .phase-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.5}
    .phase-stat{font-size:12px;color:var(--color-text-secondary);white-space:nowrap;text-align:right}
    .phase-bar{height:2px;background:var(--color-background-tertiary);margin:0 16px 0}
    .phase-fill{height:2px;background:#9B1C3A;transition:width 0.4s}
    .day-card{border-top:0.5px solid var(--color-border-tertiary);padding:14px 16px;transition:background 0.15s}

    .check-btn.done .check-icon{background:#fff}
    .check-btn.done .check-icon svg{display:block}
    .sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .sec{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;background:var(--color-background-primary)}
    .sec-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:6px;font-family:var(--font-mono)}

    .sec ul{padding-left:14px;list-style:disc}
    .sec li{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:2px}
    .sec p{font-size:12px;color:var(--color-text-secondary);line-height:1.6}
    .reset-btn{font-size:12px;color:var(--color-text-secondary);background:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:7px 12px;cursor:pointer;font-family:var(--font-sans)}

    .chevron{font-size:10px;color:var(--color-text-secondary);transition:transform 0.2s;flex-shrink:0}
    .chevron.open{transform:rotate(180deg)}
    .empty{padding:32px 16px;text-align:center;font-size:13px;color:var(--color-text-secondary)}
    </style>

    const SK = 'cppvalley:adobe:v2';
    let prog = {};
    try { prog = JSON.parse(localStorage.getItem(SK)||'{}'); } catch{}
    
    function save(){ try{ localStorage.setItem(SK, JSON.stringify(prog)); }catch{} }
    
    function dayId(pi,di){ return `${pi}-${di}`; }
    
    function totalDays(){ return phases.reduce((s,p)=>s+p.days.length,0); }
    function doneDays(){ return Object.values(prog).filter(Boolean).length; }
    
    function renderStats(){
      const total = totalDays(), done = doneDays();
      const pct = total > 0 ? Math.round((done/total)*100) : 0;
      document.getElementById('stat-pills').innerHTML = `
        <span class="pill">${total} days total</span>
        <span class="pill pill-done">${done} completed</span>
        <span class="pill">${pct}% done</span>
        <span class="pill">CS1 ready in ~10 weeks</span>
        <span class="pill">CS2 confidence in ~14 weeks</span>
      `;
    }
    
    function render(){
      const q = document.getElementById('search').value.trim().toLowerCase();
      const pf = document.getElementById('phase-filter').value;
      const sf = document.getElementById('status-filter').value;
      const wrap = document.getElementById('phases');
      wrap.innerHTML='';
    
      let anyVisible = false;
    
      phases.forEach((phase, pi)=>{
        if(pf !== 'all' && pf !== String(pi)) return;
    
        const filteredDays = phase.days.filter((day,di)=>{
          const id = dayId(pi,di);
          const done = !!prog[id];
          if(sf==='done' && !done) return false;
          if(sf==='pending' && done) return false;
          if(!q) return true;
          const hay = [day.day,day.topic,day.lld,day.core,...(day.hard||[]),...(day.medium||[])].join(' ').toLowerCase();
          return hay.includes(q);
        });
    
        if(!filteredDays.length) return;
        anyVisible = true;
    
        const doneInPhase = phase.days.filter((_,di)=>prog[dayId(pi,di)]).length;
        const pct = Math.round((doneInPhase/phase.days.length)*100);
    
        const phaseEl = document.createElement('div');
        phaseEl.className = 'phase-wrap';
    
        const hdrEl = document.createElement('div');
        hdrEl.className = 'phase-hdr';
        hdrEl.innerHTML = `
          <div class="phase-meta">
            <div class="phase-title">${phase.title}</div>
            <div class="phase-desc">${phase.desc}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="phase-stat">${doneInPhase}/${phase.days.length}</div>
            <div class="chevron" id="chev-${pi}">▼</div>
          </div>
        `;
    
        const barWrap = document.createElement('div');
        barWrap.className = 'phase-bar';
        const fill = document.createElement('div');
        fill.className = 'phase-fill';
        fill.style.width = pct+'%';
        barWrap.appendChild(fill);
    
        const bodyEl = document.createElement('div');
        bodyEl.id = `phase-body-${pi}`;
    
        filteredDays.forEach((day)=>{
          const di = phase.days.indexOf(day);
          const id = dayId(pi,di);
          const done = !!prog[id];
    
          const card = document.createElement('div');
          card.className = 'day-card' + (done?' done':'');
    
          const hasMed = day.medium && day.medium.length > 0;
    
          card.innerHTML = `
            <div class="day-top">
              <div>
                <div class="day-num">${day.day}</div>
                <div class="day-title">${day.topic}</div>
              </div>
              <button class="check-btn${done?' done':''}" data-id="${id}">
                <span class="check-icon">
                  <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 4L3 6L7 2" stroke="#9B1C3A" stroke-width="1.5" stroke-linecap="round"/></svg>
                </span>
                ${done ? 'Done' : 'Mark done'}
              </button>
            </div>
            <div class="sections">
              <div class="sec">
                <div class="sec-label crimson">Hard / medium-hard</div>
                <ul>${(day.hard||[]).map(h=>`<li>${h}</li>`).join('')}</ul>
              </div>
              ${hasMed ? `<div class="sec"><div class="sec-label">Medium / reinforcement</div><ul>${day.medium.map(m=>`<li>${m}</li>`).join('')}</ul></div>` : ''}
              <div class="sec">
                <div class="sec-label">LLD exercise</div>
                <p>${day.lld}</p>
              </div>
              <div class="sec">
                <div class="sec-label">Core concept</div>
                <p>${day.core}</p>
              </div>
            </div>
          `;
          bodyEl.appendChild(card);
        });
    
        let open = true;
        hdrEl.addEventListener('click',()=>{
          open = !open;
          bodyEl.style.display = open ? '' : 'none';
          barWrap.style.display = open ? '' : 'none';
          const chev = document.getElementById(`chev-${pi}`);
          if(chev) chev.className = 'chevron' + (open ? ' open':'');
        });
    
        phaseEl.appendChild(hdrEl);
        phaseEl.appendChild(barWrap);
        phaseEl.appendChild(bodyEl);
        wrap.appendChild(phaseEl);
      });
    
      if(!anyVisible){
        wrap.innerHTML = '<div class="empty">No days match your filters.</div>';
      }
    
      bindButtons();
      renderStats();
    }
    
    function bindButtons(){
      document.querySelectorAll('.check-btn[data-id]').forEach(btn=>{
        btn.addEventListener('click',e=>{
          e.stopPropagation();
          const id = btn.dataset.id;
          prog[id] = !prog[id];
          save();
          render();
        });
      });
    }
    
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('phase-filter').addEventListener('change', render);
    document.getElementById('status-filter').addEventListener('change', render);
    document.getElementById('reset').addEventListener('click',()=>{
      prog={};
      save();
      render();
    });
    
    render();
    </script>
